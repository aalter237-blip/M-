name: Build APK

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: "رابط الخادم المنشور (مثال: https://xxx.up.railway.app)"
        required: true
        type: string
      app_name:
        description: "اسم التطبيق"
        required: false
        default: "MM Message"
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android licenses
        run: |
          SDKM="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true

      - name: Bundle the web app into a Capacitor project
        env:
          SERVER_URL: ${{ github.event.inputs.server_url }}
          APP_NAME: ${{ github.event.inputs.app_name }}
        run: |
          test -d public || { echo "مجلد public غير موجود في جذر المستودع"; exit 1; }
          mkdir -p capapp/assets
          cat > capapp/package.json <<'EOF'
          {
            "name": "mm-apk",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/core": "^6.2.0",
              "@capacitor/android": "^6.2.0",
              "@capacitor/local-notifications": "^6.1.0",
              "socket.io-client": "4.7.5"
            },
            "devDependencies": {
              "@capacitor/cli": "^6.2.0",
              "@capacitor/assets": "^3.0.5"
            }
          }
          EOF
          (cd capapp && npm install)
          cp -r public capapp/www
          cp capapp/node_modules/socket.io-client/dist/socket.io.min.js capapp/www/socket.io.min.js
          python3 - <<'PY'
          import os, json
          url = os.environ['SERVER_URL'].strip().rstrip('/')

          # ---- app.js ----
          p = 'capapp/www/app.js'
          s = open(p, encoding='utf-8').read()
          for needle in ("const API = '';", "io({ auth: { token } })", "socket.on('message:new', m => {"):
              assert needle in s, 'missing: ' + needle
          s = s.replace("const API = '';", 'const API = ' + json.dumps(url) + ';')
          s = s.replace("io({ auth: { token } })", "io(API, { auth: { token }, transports: ['websocket'] })")
          s = s.replace("socket.on('message:new', m => {",
                        "socket.on('message:new', m => {\n    try { window.__mmNotify && window.__mmNotify(m); } catch (e) {}", 1)
          s = s.replace("pc.ontrack = e => { $('rv').srcObject = e.streams[0]; };",
                        "pc.ontrack = e => { $('rv').srcObject = e.streams[0]; $('rv').play().catch(() => {}); };")
          s += r"""

          // ---- إشعارات وأصوات أندرويد (مضافة تلقائيًا عند بناء الـ APK) ----
          (function () {
            const cap = window.Capacitor;
            const native = !!(cap && cap.isNativePlatform && cap.isNativePlatform());
            let LN = null;
            try { if (native) LN = cap.registerPlugin('LocalNotifications'); } catch (e) {}

            let ctx = null;
            function ac() {
              try {
                if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
                if (ctx.state === 'suspended') ctx.resume();
              } catch (e) {}
              return ctx;
            }
            function tone(freq, start, dur, vol) {
              const c = ac(); if (!c) return;
              const o = c.createOscillator(), g = c.createGain();
              o.type = 'sine'; o.frequency.value = freq;
              const t = c.currentTime + start;
              g.gain.setValueAtTime(0.0001, t);
              g.gain.exponentialRampToValueAtTime(vol, t + 0.03);
              g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
              o.connect(g); g.connect(c.destination);
              o.start(t); o.stop(t + dur + 0.05);
            }
            const ringIn = () => { tone(880, 0, .25, .5); tone(660, .3, .25, .5); tone(880, .8, .25, .5); tone(660, 1.1, .25, .5); };
            const ringOut = () => tone(425, 0, 1, .25);
            const beep = () => { tone(880, 0, .12, .35); tone(1175, .14, .18, .35); };

            async function initNotif() {
              ac();
              if (!LN) return;
              try { await LN.requestPermissions(); } catch (e) {}
              try { await LN.createChannel({ id: 'messages', name: 'الرسائل', importance: 5, visibility: 1, vibration: true }); } catch (e) {}
              try { await LN.createChannel({ id: 'calls', name: 'المكالمات', importance: 5, visibility: 1, vibration: true }); } catch (e) {}
            }
            function show(title, body, channelId) {
              if (!LN) return;
              LN.schedule({ notifications: [{ id: Math.floor(Math.random() * 2147483000), title, body, channelId }] }).catch(() => {});
            }
            ['touchstart', 'click'].forEach(ev => document.addEventListener(ev, function once() {
              document.removeEventListener(ev, once); initNotif();
            }, { passive: true }));
            document.addEventListener('DOMContentLoaded', initNotif);

            window.__mmNotify = function (m) {
              if (!me || m.from === me.id) return;
              if (!document.hidden && cur === m.from) return;
              if (!document.hidden) beep();
              const u = users[m.from];
              show((u && u.name) || 'M&M', m.type === 'v' ? '🎤 رسالة صوتية' : (m.text || 'رسالة جديدة'), 'messages');
            };

            function banner(t) {
              let b = document.getElementById('mmBanner');
              if (!t) { if (b) b.remove(); return; }
              if (!b) {
                b = document.createElement('div'); b.id = 'mmBanner';
                b.style.cssText = 'position:fixed;left:0;right:0;top:0;z-index:99;background:#b91c1c;color:#fff;padding:6px 10px;font-size:13px;text-align:center';
                document.body.appendChild(b);
              }
              b.textContent = t;
            }

            let mode = null, timer = null;
            function setMode(m) {
              if (m === mode) return;
              mode = m; clearInterval(timer); timer = null;
              if (!m) return;
              const play = m === 'in'
                ? () => { ringIn(); try { navigator.vibrate && navigator.vibrate([400, 200, 400]); } catch (e) {} }
                : ringOut;
              play(); timer = setInterval(play, m === 'in' ? 2200 : 4000);
            }
            setInterval(() => {
              if (typeof socket !== 'undefined' && socket && !socket.__dbg) {
                socket.__dbg = true;
                socket.on('connect_error', e => banner('تعذر الاتصال بالخادم: ' + ((e && e.message) || '')));
                socket.on('connect', () => banner(''));
                socket.on('disconnect', r => banner('انقطع الاتصال: ' + r));
              }
              const ring = document.getElementById('ring');
              const callEl = document.getElementById('call');
              const cn = document.getElementById('cn');
              if (ring && !ring.hidden) {
                if (mode !== 'in' && document.hidden) show('📞 مكالمة واردة', (document.getElementById('rt') || {}).textContent || '', 'calls');
                setMode('in');
              } else if (callEl && !callEl.hidden && cn && cn.textContent.indexOf('جارٍ الاتصال بـ') === 0) {
                setMode('out');
              } else {
                setMode(null);
              }
            }, 400);
          })();
          """
          open(p, 'w', encoding='utf-8').write(s)

          # ---- index.html ----
          p = 'capapp/www/index.html'
          h = open(p, encoding='utf-8').read()
          needle = '<script src="/socket.io/socket.io.js"></script>'
          assert needle in h, 'missing socket script'
          h = h.replace(needle, '<script src="socket.io.min.js"></script>')
          open(p, 'w', encoding='utf-8').write(h)

          # ---- fix the giant default play icon on <video> in WebView ----
          p = 'capapp/www/index.html'
          h = open(p, encoding='utf-8').read()
          POSTER = 'poster="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"'
          for vid in ('<video id="rv" autoplay playsinline>', '<video id="lv" autoplay playsinline muted>'):
              assert vid in h, 'missing ' + vid
              h = h.replace(vid, vid[:-1] + ' ' + POSTER + '>')
          open(p, 'w', encoding='utf-8').write(h)

          # ---- full-height layout and clean video ----
          p = 'capapp/www/style.css'
          c = open(p, encoding='utf-8').read()
          c += "\nhtml,body{height:100dvh}\n#rv,#lv{background:#000}\nvideo::-webkit-media-controls{display:none!important}\n"
          open(p, 'w', encoding='utf-8').write(c)
          print('patched OK for', url)
          PY
          node -e "
          const url = process.env.SERVER_URL.trim().replace(/\/+$/, '');
          const cfg = {
            appId: 'com.mm.message',
            appName: process.env.APP_NAME || 'MM Message',
            webDir: 'www',
            backgroundColor: '#0b0f14',
            server: { androidScheme: 'https', cleartext: url.startsWith('http://') },
            android: { backgroundColor: '#0b0f14' }
          };
          require('fs').writeFileSync('capapp/capacitor.config.json', JSON.stringify(cfg, null, 2));
          "
          cd capapp
          npx cap add android

      - name: Generate icon and splash screen
        continue-on-error: true
        working-directory: capapp
        run: |
          IM=$(command -v magick || echo convert)
          $IM -size 1024x1024 xc:'#0f766e' -gravity center -fill white -font DejaVu-Sans-Bold -pointsize 300 -annotate 0 'M&M' assets/icon.png
          $IM -size 2732x2732 xc:'#0f766e' -gravity center -fill white -font DejaVu-Sans-Bold -pointsize 420 -annotate 0 'M&M' assets/splash.png
          cp assets/splash.png assets/splash-dark.png
          npx capacitor-assets generate --android

      - name: Permissions, status bar and keyboard
        working-directory: capapp
        run: |
          M=android/app/src/main/AndroidManifest.xml
          for P in RECORD_AUDIO CAMERA MODIFY_AUDIO_SETTINGS POST_NOTIFICATIONS VIBRATE; do
            sed -i "/<\/manifest>/i\    <uses-permission android:name=\"android.permission.$P\" />" $M
          done
          sed -i '/<\/manifest>/i\    <uses-feature android:name="android.hardware.camera" android:required="false" />' $M
          S=android/app/src/main/res/values/styles.xml
          sed -i 's#</style>#    <item name="android:statusBarColor">\#0b0f14</item>\n        <item name="android:navigationBarColor">\#0b0f14</item>\n    </style>#' $S
          sed -i 's#android:windowSoftInputMode="[^"]*"##; s#<activity#<activity android:windowSoftInputMode="adjustResize"#' $M
          cat $M $S

      - name: Sync and build debug APK
        working-directory: capapp
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MM-Message-APK
          path: capapp/android/app/build/outputs/apk/debug/app-debug.apk
